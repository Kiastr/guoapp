name: Build app packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
        continue-on-error: true
      - run: dart analyze lib test integration_test test_driver
        continue-on-error: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # 测试当前不阻塞出包（开发优先、集中验证暂缓），结果仍会显示在运行详情里。
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
        continue-on-error: true
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
        continue-on-error: true
      - run: go test -race ./...
        working-directory: native
        continue-on-error: true
      - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native
        continue-on-error: true

  prepare-release:
    # Release 必须由**一个** job 创建。之前两个 android 矩阵 job 各自跑
    # `gh release view || gh release create`，并发时 GitHub 会造出两个同名
    # tag 的 Release 对象（0.2.74+150 正是如此：429298580 带 7 个附件、
    # 429298581 是空壳），此后所有按 tag 的写操作都会撞 422「Release.
    # tag_name already exists」——release job 就是这样发不出去的。
    # 注意这里不能用 `if: github.event_name != 'pull_request'` 把整个 job
    # 跳过：android 依赖本 job，一 skip 整条编译链就跟着跳过，PR 会失去编译
    # 校验。所以 job 照跑，只在步骤里判断要不要真的建 Release。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 预建 Release 占位
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # fork 来的 PR 只有读权限、发不了 Release；本仓库自己的 PR 也不
          # 需要在版本号上挂附件。
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "PR 构建，跳过预建 Release"
            exit 0
          fi
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          tag="app-v${version//+/-}"
          sha="${GITHUB_SHA}"
          # tag 必须先于 Release 存在：下面与 release job 都带 --verify-tag
          # 兜底，而该参数的语义是「tag 不在就中止」——+152 修的就是这个坑：
          # 清理 +150 的重复空壳 Release 时 tag 一起被带走，于是本 job 直接
          # `tag ... doesn't exist ... aborting`，android / release 全被跳过，
          # 六个 APK 一个都没编译。这里先把 tag 建（或挪）到本次 commit。
          # 每步都显式判退出码并回显错误体：gh api 失败时默认把响应写到
          # stderr，被重定向吞掉后只剩一个 exit 1，非常难定位。
          cur=""
          if out=$(gh api "repos/$REPO/git/ref/tags/$tag" --jq .object.sha 2>&1); then
            cur="$out"
          else
            echo "tag $tag 尚不存在（$out），准备新建"
          fi
          if [ -z "$cur" ]; then
            if ! out=$(gh api -X POST "repos/$REPO/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$sha" 2>&1); then
              echo "建 tag 失败：$out" >&2
              exit 1
            fi
            echo "已建 tag $tag -> $sha"
          elif [ "$cur" != "$sha" ]; then
            if ! out=$(gh api -X PATCH "repos/$REPO/git/refs/tags/$tag" \
              -f "sha=$sha" -F force=true 2>&1); then
              echo "移动 tag 失败：$out" >&2
              exit 1
            fi
            echo "已把 tag $tag 从 $cur 移到 $sha"
          else
            echo "tag $tag 已指向 $sha，沿用"
          fi
          # 重跑同一版本时 Release 已存在，view 命中就不重复建。
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --verify-tag \
                 --title "红果鉴 / 真果鉴 ${version}" \
                 --notes "构建中，说明与校验文件随后更新。"
  android:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      # 新库无 Actions 缓存积累，首次构建峰值磁盘需求超出 runner 可用空间
      # （倒在 R8/LLVM 阶段 No space left on device）。此处预先回收 runner
      # 预装但本构建不需要的大件：docker 镜像、CodeQL、dotnet、Azure CLI、
      # SDK 自带 cmake（Gradle 需要时会自动重装）。Android SDK / NDK /
      # flutter 缓存均不动，避免破坏构建环境。
      - name: 释放磁盘空间
        run: |
          df -h / || true
          sudo rm -rf /usr/local/lib/android/sdk/cmake || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/az || true
          df -h / || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Configure Android signing
        id: signing
        run: |
          python scripts/configure_signing.py
          if [ -f android/key.properties ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置发布签名 Secrets，本次 APK 使用 debug 签名，仅供测试，不可用于正式分发。"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: python scripts/build_android.py ${{ matrix.arguments }}
      - name: 校验 APK 签名证书
        if: steps.signing.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ vars.ANDROID_CERT_SHA256 }}'
          if [ -z "$expected" ]; then
            echo "未设置仓库变量 ANDROID_CERT_SHA256，跳过证书指纹比对。" >&2
            exit 0
          fi
          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -n1 || true)
          if [ -z "$apksigner" ]; then
            sdkmanager 'build-tools;35.0.0' >/dev/null
            apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n1)
          fi
          echo "apksigner：$apksigner"
          "$apksigner" --version || true
          for apk in dist/android/*.apk; do
            echo "== $(basename "$apk")"
            output=$("$apksigner" verify --print-certs "$apk" 2>&1 || true)
            printf '%s\n' "$output"
            if ! printf '%s' "$output" | tr -d ':' | tr '[:upper:]' '[:lower:]' | grep -q "$expected"; then
              echo "签名证书与发布证书不一致，已终止。" >&2
              exit 1
            fi
          done
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      # 产物不经 actions/upload-artifact 中转，直接传到本版本 Release。
      #
      # 原因：Actions 产物存储是账号级的 500MB 配额。一旦撞满，编译成功的 job
      # 会倒在最后一步 "Failed to CreateArtifact: Artifact storage quota has
      # been hit"（三个 ABI 的 APK 都已 Built、签名也验过），job 判 failure 后
      # 依赖它的 release job 被 skip，整版一个包都发不出去。Release 附件按仓库
      # 体积算，不受该配额约束，所以编译完就把 APK 传上去，SHA256SUMS 与说明
      # 文案仍由 release job 负责（它改成从 Release 取回文件）。
      - name: 上传 APK 到 Release
        # fork 来的 PR 只有读权限、发不了 Release；本仓库自己的 PR 也不需要
        # 在版本号上挂附件。
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Releases API 偶发 502（"HTTP 502: Server Error (.../releases/assets/...)"），
          # 结果就是某个架构的包没传上去、Release 少一个附件。逐个文件上传并
          # 各自重试：一条命令传全部的话，任意一个撞 502 整批失败，而且
          # --clobber 会先把已传的删掉再重来，越重试越乱。
          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 5 ]; then
                echo "重试 5 次仍失败：$*" >&2
                return 1
              fi
              echo "第 ${attempt} 次失败，$((attempt * 5)) 秒后重试：$*" >&2
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          tag="app-v${version//+/-}"
          # Release 由 prepare-release 唯一创建，本 job 只上传。这里短暂等
          # 一下是因为按 tag 查询存在极短的可见性延迟；等到就继续，等不到
          # 直接失败，不要自己 create——并发 create 正是重复 Release 的源头。
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Release 未就绪：$tag" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          for file in dist/android/*.apk; do
            retry gh release upload "$tag" "$file" --clobber
          done
  ios:
    if: false
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4

  release:
    needs: [android]
    if: always() && needs.android.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # 不再从 actions/download-artifact 取文件：产物上传那一步本身就是配额
      # 瓶颈（见 android job 里的说明），这里改成把两个矩阵 job 已经传到本
      # 版本 Release 的附件拉回来，再补 SHA256SUMS、说明文案、清理过期附件。
      - name: 取回本版本已上传的产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          tag="app-v${version//+/-}"
          mkdir -p release
          # 必须全量下载再删校验文件：gh release download 传 --pattern 时，
          # 任一 pattern 匹配不到资产会直接退出 1（ios/windows 任务目前是关的，
          # *.ipa / *.zip 必然为空），而旧一轮的 SHA256SUMS.txt 如果不先删掉，
          # 会被算进新一轮清单里。
          gh release download "$tag" -D release --clobber
          rm -f release/SHA256SUMS.txt
      - name: 生成发布文件清单
        run: |
          set -euo pipefail
          cd release
          mapfile -t files < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Release 里取不到任何产物，构建可能未完成。" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          tag="app-v${version//+/-}"
          apk_note="Android（已用固定发布证书签名，可覆盖安装升级，无需卸载）："
          if printf '%s\n' "${{ vars.ANDROID_CERT_SHA256 }}" | grep -q .; then
            apk_note="Android（已用固定发布证书签名，可覆盖安装升级，无需卸载）："
          else
            apk_note="Android（未配置发布签名，当前为 debug 签名，仅供测试，不能覆盖正式版安装）："
          fi
          {
            printf '%s\n\n' "版本 ${version}。两个版本功能相同，区别只在站源范围，按需选择："
            printf '%s\n' "- 红果鉴 hongguojian：仅红果站源"
            printf '%s\n' "- 真果鉴 zhenguojian：全部站源"
            printf '\n%s\n' "$apk_note"
            printf '%s\n' "- *-arm64-v8a.apk：绝大多数手机选这个"
            printf '%s\n' "- *-armeabi-v7a.apk：较老的 32 位手机"
            printf '%s\n' "- *-x86_64.apk：模拟器"
            printf '\n%s\n' "iOS（未签名，需自行签名后才能安装）："
            printf '%s\n' "- *-ios-unsigned.ipa：未签名 IPA，用 AltStore / Sideloadly / TrollStore 等工具自签后安装"
            printf '%s\n' "- *-ios-unsigned-app.zip：未签名 Runner.app 压缩包，供自行签名 / 打包使用"
            printf '\n%s\n' "Windows（解压后运行 hongguojian.exe 或 zhenguojian.exe）："
            printf '%s\n' "- *-windows-x64.zip：Windows 10/11 x64 完整包；构建机没有音频和图形设备，播放自检未通过，未做设备验收"
            printf '\n%s\n' "校验：SHA256SUMS.txt"
            if printf '%s\n' "${{ vars.ANDROID_CERT_SHA256 }}" | grep -q .; then
              printf '%s\n' "签名证书 SHA-256：${{ vars.ANDROID_CERT_SHA256 }}"
            else
              printf '%s\n' "签名证书：未配置（当前为 debug 签名）"
            fi
          } > notes.md
          # 同 android job：逐文件 + 重试，避免单个附件撞 502 拖垮整批。
          retry_upload() {
            local attempt=1
            until gh release upload "$tag" "$1" --clobber; do
              if [ "$attempt" -ge 5 ]; then
                echo "重试 5 次仍失败：$1" >&2
                return 1
              fi
              echo "第 ${attempt} 次失败，$((attempt * 5)) 秒后重试：$1" >&2
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }

          # Release 存在性判断必须带重试。Releases API 偶发 502 / 限流会让
          # gh release view 直接返回非零，一次误判就会走进 create 分支，撞
          # 422「Release.tag_name already exists」——本版正是这么挂的：6 个
          # APK 早传完了，唯独校验文件和说明文案没补上。
          exists=no
          for attempt in 1 2 3; do
            if gh release view "$tag" >/dev/null 2>&1; then
              exists=yes
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 4))
            fi
          done

          if [ "$exists" = yes ]; then
            # 主路径：只回传本轮新生成的校验文件。
            #
            # 这些 APK 是上面刚从**同一个 Release** 下载下来的，逐个体重传
            # 200+ MB 毫无意义，还会把一次构建拖进 502/超时。缺架构的情况
            # 这里也补不了——本地没有的文件，从 Release 也下不到。
            retry_upload release/SHA256SUMS.txt
          else
            # tag 常常已经由 android job 的 create 建出来了（两个矩阵 job 并发
            # 时必然如此），所以带 --verify-tag，允许「tag 在、Release 不在」。
            if ! gh release create "$tag" release/* --verify-tag \
              --title "红果鉴 / 真果鉴 ${version}" --notes-file notes.md; then
              # 撞 422 说明 Release 其实存在、只是刚才没查到。回落成补传，
              # 别让整版发不出去。
              echo "create 失败，回落到补传校验文件" >&2
              retry_upload release/SHA256SUMS.txt
            fi
          fi
          gh release edit "$tag" --title "红果鉴 / 真果鉴 ${version}" --notes-file notes.md
          # 清理上一次构建留下、本轮已不再产出的附件，避免下载到过期文件。
          # Windows ZIP 由独立的 Build Windows package 工作流管理（它自己
          # --clobber 覆盖），这里不能删：两个工作流可能同时在线，本轮下载
          # 快照里没有的 ZIP 正是另一个工作流刚传上去的。
          for name in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
            case "$name" in
              *-windows-x64.zip) continue ;;
            esac
            if [ ! -e "release/$name" ]; then
              # 删除失败不阻断发布——附件多留一个比整版发不出去好。
              gh release delete-asset "$tag" "$name" --yes || echo "清理旧附件失败（忽略）：$name" >&2
            fi
          done
